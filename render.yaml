# Corrected Render Blueprint configuration
services:
  # Backend Python service
  - type: web
    name: backend-service
    runtime: python  # Use 'runtime' instead of 'env'
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8001
    plan: free
    branch: main
    rootDir: backend

  # Frontend static site
  - type: web
    name: react-vite-frontend
    runtime: static  # Required for static sites
    buildCommand: npm install && npm run build
    staticPublishPath: dist  # Required for static sites
    plan: free
    branch: main
    rootDir: .
    envVars:
      - key: VITE_API_URL
        value: https://backend-service.onrender.com